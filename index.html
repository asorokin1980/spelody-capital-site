<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelody Capital</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #202124;
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .banner {
    min-height: 280px;
    background: linear-gradient(135deg, #2b2f38 0%, #3a4049 40%, #4b525d 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }
  .banner span {
    color: #ffffff;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 1.5px;
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    max-width: 640px;
    margin: 0 auto;
    padding: 64px 32px;
  }
  .content p {
    font-size: 19px;
    line-height: 1.7;
    color: #3c4043;
  }
  .divider {
    width: 48px;
    height: 3px;
    background: #4b525d;
    border-radius: 2px;
    margin: 28px 0;
  }
</style>
</head>
<body>
  <div class="banner"><span>SPELODY CAPITAL</span></div>
  <div class="content">
    <p>Spelody Capital advises founders and owners on corporate development - M&amp;A, fundraising, and strategic partnerships.</p>
    <div class="divider"></div>
    <p>Senior-led, end to end.</p>
  </div>
</body>
</html>
